# Task configurations for RPG Gaming Assistant

research_task:
  description: >
    Search for information about "{game_name}" to answer: "{query}"

    Use the "Search Game Information" tool to find the answer.
    The tool returns numbered snippets with source citations.

    IMPORTANT: Extract the factual content from each snippet and synthesize a
    concise answer. Do NOT echo the raw snippet format ([N], [Cache], [Web],
    "confidence %", or "\u2014 Source:" markers) in your output.
    Return only the facts plus a single source URL.

  expected_output: >
    Synthesized answer to the query containing:
    - The specific answer (1-3 sentences, concise)
    - Key supporting details if relevant
    - One source URL

  agent: researcher

reporting_task:
  description: >
    Provide a brief, direct answer to: "{query}" for {game_name}
    
    CRITICAL:
    - Answer the question directly in 1-3 sentences maximum
    - Include only essential details
    - No lengthy overviews or tips sections
    - If multiple steps exist, use a numbered list (max 3-5 items)
    - Attach source URL at the end

  expected_output: >
    Concise answer (1-3 sentences) with:
    - Direct response to the question
    - Key details if needed (locations, items, numbers)
    - Source URL

  agent: game_expert
  context:
    - research_task


